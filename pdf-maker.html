<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鑑定書PDFメーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hiragino Kaku Gothic Pro', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
    .sidebar { width: 400px; background: white; padding: 20px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
    .preview-container { flex: 1; overflow-y: auto; padding: 40px; background: #e0e5ec; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    h1 { font-size: 20px; color: #333; margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #555; }
    textarea { width: 100%; height: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical; }
    input[type="file"] { width: 100%; font-size: 14px; }
    
    .controls { display: flex; gap: 10px; margin-top: 5px; }
    .controls button { padding: 4px 8px; font-size: 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    .controls button:hover { background: #f0f0f0; }
    
    .btn-main {
      background: linear-gradient(135deg, #7b2ff7, #f72f7b);
      color: white; border: none; padding: 15px; width: 100%; font-size: 16px;
      font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px;
    }
    
    /* PDF Pages */
    #pdf-content { background: transparent; }
    .page {
      width: 794px; height: 1123px; /* A4 size at 96 DPI */
      background-color: #fff; background-size: cover; background-position: center;
      position: relative; overflow: hidden; margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    /* Temporary background colors until images are uploaded */
    .page::before {
      content: attr(data-placeholder); position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #ccc; font-size: 30px; font-weight: bold; z-index: 1;
    }
    
    /* Text elements inside pages */
    .pdf-text {
      position: absolute; z-index: 10;
      font-family: 'Noto Serif JP', serif; /* Mincho */
      color: #333; /* Dark gray for readability */
      white-space: pre-wrap; line-height: 1.6; font-size: 16px;
      /* Default positioning */
      top: 100px; left: 80px; right: 80px; bottom: 100px;
    }
    .pdf-image {
      position: absolute; z-index: 5; object-fit: contain;
    }
    
    /* Specific element positions (Provisional) */
    #img-horoscope { top: 150px; left: 100px; width: 594px; height: 350px; border: 1px dashed #ccc; }
    #text-p2 { top: 550px; }
    #img-cards { top: 150px; left: 50px; width: 694px; height: 400px; border: 1px dashed #ccc; }
    #text-p4 { top: 600px; }
    
  </style>
</head>
<body>

<div class="sidebar">
  <h1>✨ 鑑定書PDFメーカー</h1>
  <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Claudeのテキストと画像を貼り付けるだけで、A4明朝体の美しいPDFが完成します。</p>

  <div class="form-group">
    <label>🌟 2P目：ホロスコープ画像</label>
    <input type="file" id="upload-horoscope" accept="image/*" onchange="previewImage(event, 'img-horoscope')">
  </div>
  
  <div class="form-group">
    <label>🔮 4P目：カード展開画像（アプリから保存したもの）</label>
    <input type="file" id="upload-cards" accept="image/*" onchange="previewImage(event, 'img-cards')">
  </div>

  <hr style="border:none; border-top:1px solid #eee; margin: 20px 0;">

  <!-- Text Inputs -->
  <div class="form-group">
    <label>📝 2P目テキスト（ホロスコープ解説）</label>
    <textarea id="input-p2" oninput="updateText('p2')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p2','fs',1)">＋</button><button onclick="adjust('p2','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p2','lh',0.1)">＋</button><button onclick="adjust('p2','lh',-0.1)">ー</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>📝 3P目テキスト（ホロスコープ続き）</label>
    <textarea id="input-p3" oninput="updateText('p3')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p3','fs',1)">＋</button><button onclick="adjust('p3','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p3','lh',0.1)">＋</button><button onclick="adjust('p3','lh',-0.1)">ー</button>
    </div>
  </div>

  <div class="form-group">
    <label>📝 4P目テキスト（カード解説）</label>
    <textarea id="input-p4" oninput="updateText('p4')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p4','fs',1)">＋</button><button onclick="adjust('p4','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p4','lh',0.1)">＋</button><button onclick="adjust('p4','lh',-0.1)">ー</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>📝 5P目テキスト（続き）</label>
    <textarea id="input-p5" oninput="updateText('p5')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p5','fs',1)">＋</button><button onclick="adjust('p5','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p5','lh',0.1)">＋</button><button onclick="adjust('p5','lh',-0.1)">ー</button>
    </div>
  </div>

  <div class="form-group">
    <label>📝 6P目テキスト（続き）</label>
    <textarea id="input-p6" oninput="updateText('p6')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p6','fs',1)">＋</button><button onclick="adjust('p6','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p6','lh',0.1)">＋</button><button onclick="adjust('p6','lh',-0.1)">ー</button>
    </div>
  </div>

  <div class="form-group">
    <label>📝 7P目テキスト（メッセージ）</label>
    <textarea id="input-p7" oninput="updateText('p7')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p7','fs',1)">＋</button><button onclick="adjust('p7','fs',-1)">ー</button>
      <span style="margin-left:10px;">行間:</span><button onclick="adjust('p7','lh',0.1)">＋</button><button onclick="adjust('p7','lh',-0.1)">ー</button>
    </div>
  </div>

  <button class="btn-main" onclick="generatePDF()">📥 PDFをダウンロードする</button>
  <div id="loading" style="display:none; text-align:center; margin-top:10px; color:#f72f7b; font-weight:bold;">PDF生成中...少々お待ちください</div>
</div>

<div class="preview-container">
  <div id="pdf-content">
    
    <div class="page" id="page1" data-placeholder="背景画像1 (表紙)" style="background-color: #fce4ec;"></div>
    
    <div class="page" id="page2" data-placeholder="背景画像2 (ホロスコープ)" style="background-color: #f3e5f5;">
      <img id="img-horoscope" class="pdf-image" style="display:none;">
      <div id="text-p2" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page3" data-placeholder="背景画像3" style="background-color: #e8eaf6;">
      <div id="text-p3" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page4" data-placeholder="背景画像4 (カード)" style="background-color: #e3f2fd;">
      <img id="img-cards" class="pdf-image" style="display:none;">
      <div id="text-p4" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page5" data-placeholder="背景画像5" style="background-color: #e0f7fa;">
      <div id="text-p5" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page6" data-placeholder="背景画像6" style="background-color: #e8f5e9;">
      <div id="text-p6" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page7" data-placeholder="背景画像7 (メッセージ)" style="background-color: #fff3e0;">
      <div id="text-p7" class="pdf-text"></div>
    </div>
    
    <div class="page" id="page8" data-placeholder="背景画像8 (裏表紙)" style="background-color: #fbe9e7;"></div>

  </div>
</div>

<script>
// State for typography adjustments
const styles = {
  p2: { fs: 16, lh: 1.6 },
  p3: { fs: 16, lh: 1.6 },
  p4: { fs: 16, lh: 1.6 },
  p5: { fs: 16, lh: 1.6 },
  p6: { fs: 16, lh: 1.6 },
  p7: { fs: 16, lh: 1.6 }
};

function updateText(id) {
  document.getElementById('text-' + id).textContent = document.getElementById('input-' + id).value;
}

function previewImage(event, imgId) {
  const file = event.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById(imgId);
      img.src = e.target.result;
      img.style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

function adjust(id, prop, amount) {
  styles[id][prop] += amount;
  const el = document.getElementById('text-' + id);
  if(prop === 'fs') {
    el.style.fontSize = styles[id].fs + 'px';
  } else if(prop === 'lh') {
    el.style.lineHeight = styles[id].lh;
  }
}

function generatePDF() {
  document.getElementById('loading').style.display = 'block';
  
  // Hide placeholder text before rendering by setting color to transparent
  const styleTag = document.createElement('style');
  styleTag.innerHTML = '.page::before { color: transparent !important; }';
  document.head.appendChild(styleTag);

  const element = document.getElementById('pdf-content');
  const opt = {
    margin:       0,
    filename:     `結城あや_鑑定書_${Date.now()}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    document.getElementById('loading').style.display = 'none';
    styleTag.remove();
  });
}
</script>
</body>
</html>
