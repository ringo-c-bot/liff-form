    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
    textarea { width: 100%; height: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical; font-size: 13px; box-sizing: border-box; }

    .controls, .img-controls { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
    .controls button, .img-controls button { padding: 2px 6px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    .controls span { font-size: 11px; color: #666; }
    
    .btn-main { background: linear-gradient(135deg, #7b2ff7, #f72f7b); color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-magic { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,198,255,0.4); }
    .btn-card { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #333; border: 1px solid #ff9a9e; padding: 10px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; }

    /* PDF Pages */
    #pdf-content { background: transparent; }
    .page { width: 794px; height: 1123px; background-color: #fff; background-size: cover; background-position: center; position: relative; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .pdf-text { position: absolute; z-index: 10; font-family: 'Noto Serif JP', serif; color: #333; white-space: pre-wrap; line-height: 1.6; font-size: 16px; top: 120px; left: 100px; right: 100px; bottom: 120px; }

<script>

  {n:"Stellar Alignment",i:6},{n:"The Dreamer's Sky",i:7},{n:"Galactic Wings",i:8},{n:"Cosmic Abundance",i:9},{n:"Stardust Path",i:10},
  {n:"The Celestial Crown",i:11},{n:"Nebula of Creation",i:12},{n:"The Guiding Star",i:13},{n:"The Celestial Sun",i:14},{n:"Infinite Horizons",i:15},
  {n:"The Star Child",i:16},{n:"Celestial Protection",i:17},{n:"The Stellar Compass",i:18},{n:"Sacred Constellations",i:19},{n:"The Cosmic Mirror",i:20},
  {n:"The Aurora's Gift",i:21},{n:"Galactic Harmony",i:22},{n:"The Moon's Whisper",i:23},{n:"The Starry Embrace",i:24},{n:"Eclipsed Truth",i:25},
  {n:"The Sacred Spiral",i:26},{n:"Universal Flow",i:27},{n:"Radiant Intentions",i:28},{n:"Galactic Dreams",i:29},{n:"Stellar Wisdom",i:30},
  {n:"The Cosmic Dance",i:31},{n:"The Twin Stars",i:32},{n:"The Starfall",i:33},{n:"The Celestial Chalice",i:34},{n:"The Solar Garden",i:35},
  {n:"The Celestial Bridge",i:36},{n:"The Cosmic Flame",i:37},{n:"The Stellar Temple",i:38},{n:"The Cosmic Thread",i:39},{n:"The Star Gate",i:40},
  {n:"The Cosmic Seed",i:41},{n:"The Radiant Crown",i:42},{n:"The Nebula's Song",i:43},{n:"The Eternal Star",i:44}
];

let currentPlan = 1;

function selectPlan(n) {
  currentPlan = n;
  document.querySelectorAll('.plan-btn').forEach((b,i) => { b.classList.toggle('active', i===n-1); });
}

function pickUnique(arr, n) {
  const copy = [...arr]; const result = [];
  for(let i=0;i<n;i++){ const idx=Math.floor(Math.random()*copy.length); result.push(copy.splice(idx,1)[0]); }
  return result;
}
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function pos() { return Math.random() > 0.5 ? '正位置' : '逆位置'; }

function loadImageObj(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null); // fail gracefully
    img.src = src;
  });
}

function drawImgRotated(ctx, img, x, y, w, h, rev) {
  if (rev) {
    ctx.save(); ctx.translate(x + w/2, y + h/2); ctx.rotate(Math.PI);
    ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}

async function drawAllCards() {
  const t = pickUnique(tarot, 3); const tp = Array.from({length:3}, pos);
  const l = pickUnique(lenormand, 3); const o = pick(oracle);
  
  let result = '';
  if(currentPlan===1) {
    result = `タロット:\n・現在→${t[0].n} ${tp[0]}\n・障害→${t[1].n} ${tp[1]}\n・未来→${t[2].n} ${tp[2]}`;
  } else if(currentPlan===2) {
    result = `タロット:\n・現在→${t[0].n} ${tp[0]}\n・障害→${t[1].n} ${tp[1]}\n・未来→${t[2].n} ${tp[2]}\nルノマン:\n・${l[0].n}`;
  } else {
    result = `タロット:\n・現在→${t[0].n} ${tp[0]}\n・障害→${t[1].n} ${tp[1]}\n・未来→${t[2].n} ${tp[2]}\nルノマン:\n・${l[0].n}・${l[1].n}・${l[2].n}\nオラクル:\n・${o.n}`;
  }
  
  document.getElementById('ai-cards').value = result;
  
  // Render Canvas
  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const bg = await loadImageObj('images/bg_table.png');
  if(bg) ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  else { ctx.fillStyle = '#1a0a3e'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

  const tw=200, th=340, gap=50, lw=200, lh=300, ow=220, oh=320;
  
  if (currentPlan === 1) {
    const startX = (canvas.width - (3*tw + 2*gap)) / 2;
    for(let i=0; i<3; i++) {
      const img = await loadImageObj(`images/tarot_${t[i].i}.png`);
      if(img) drawImgRotated(ctx, img, startX + i*(tw+gap), 380, tw, th, tp[i]==='逆位置');
    }
  } else if (currentPlan === 2) {
    const startX = (canvas.width - (3*tw + 2*gap)) / 2;
    for(let i=0; i<3; i++) {
      const img = await loadImageObj(`images/tarot_${t[i].i}.png`);
      if(img) drawImgRotated(ctx, img, startX + i*(tw+gap), 200, tw, th, tp[i]==='逆位置');
    }
    const lImg = await loadImageObj(`images/lenormand_${l[0].i}.png`);
    if(lImg) drawImgRotated(ctx, lImg, (canvas.width - lw)/2, 600, lw, lh, false);
  } else if (currentPlan === 3) {
    const startX = (canvas.width - (3*tw + 2*gap)) / 2;
    for(let i=0; i<3; i++) {
      const img = await loadImageObj(`images/tarot_${t[i].i}.png`);
      if(img) drawImgRotated(ctx, img, startX + i*(tw+gap), 60, tw, th, tp[i]==='逆位置');
    }
    const startX_L = (canvas.width - (3*lw + 2*gap)) / 2;
    for(let i=0; i<3; i++) {
      const img = await loadImageObj(`images/lenormand_${l[i].i}.png`);
      if(img) drawImgRotated(ctx, img, startX_L + i*(lw+gap), 430, lw, lh, false);
    }
    const oImg = await loadImageObj(`images/oracle_${o.i}.png`);
    if(oImg) drawImgRotated(ctx, oImg, (canvas.width - ow)/2, 750, ow, oh, false);
  }
  
  // Set image to preview
  const dataUrl = canvas.toDataURL('image/png');
  const previewImg = document.getElementById('img-cards');
  previewImg.src = dataUrl;
  previewImg.style.display = 'block';
  
  alert("カードを引きました！結果は自動で裏側に保存され、画像は4P目にセットされました！✨");
}


// --- PDF Maker Logic ---
const styles = {};
['p2','p3','p4','p5','p6','p7'].forEach(id => {
  styles[id] = { fs: 16, lh: 1.6, pad: 100, top: (id==='p2'?550:(id==='p4'?600:120)) };
});
const imgStyles = {
  horoscope: { w: 594, t: 150, l: 100 },
  cards: { w: 694, t: 150, l: 50 }
};

window.onload = () => {
  const savedKey = localStorage.getItem('geminiApiKey');
  if(savedKey) document.getElementById('api-key').value = savedKey;
};

function saveApiKey() { localStorage.setItem('geminiApiKey', document.getElementById('api-key').value); }
function updateText(id) { document.getElementById('text-' + id).textContent = document.getElementById('input-' + id).value; }

function previewImage(event, imgId) {
  const file = event.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById(imgId);
      img.src = e.target.result;
      img.style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

function adjust(id, prop, amount) {
  styles[id][prop] += amount;
  const el = document.getElementById('text-' + id);
  if(prop === 'fs') el.style.fontSize = styles[id].fs + 'px';
  else if(prop === 'lh') el.style.lineHeight = styles[id].lh;
  else if(prop === 'pad') { el.style.left = styles[id].pad + 'px'; el.style.right = styles[id].pad + 'px'; }
  else if(prop === 'top') el.style.top = styles[id].top + 'px';
}

function adjImg(id, prop, amount) {
  imgStyles[id][prop] += amount;
  const el = document.getElementById('img-' + id);
  if(prop === 'w') el.style.width = imgStyles[id].w + 'px';
  else if(prop === 't') el.style.top = imgStyles[id].t + 'px';
  else if(prop === 'l') el.style.left = imgStyles[id].l + 'px';
}

// AI Generation (Gemini)
async function fileToGenerativePart(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => { resolve({ inlineData: { data: reader.result.split(",")[1], mimeType: file.type } }); };
    reader.readAsDataURL(file);
  });
}

async function generateWithAI() {
  const apiKey = document.getElementById('api-key').value;
  if(!apiKey) { alert("Gemini APIキーを入力してください！"); return; }
  
  const userInfo = document.getElementById('ai-userinfo').value;
  const cards = document.getElementById('ai-cards').value;
  const files = document.getElementById('ai-horoscope-images').files;
  
  if(!userInfo || !cards) {
    alert("お客様情報か、カード結果（カードを引く）がセットされていません！"); return;
  }
  if(files.length === 0) {
    if(!confirm("ホロスコープの画像が選択されていません！星読みなしでカードだけで占いますか？")) return;
  }
  
  document.getElementById('ai-loading').style.display = 'block';
  
  try {
    const imageParts = await Promise.all([...files].map(fileToGenerativePart));
    
    let prompt = `
あなたは「プロの星読み＆カード鑑定士・結城あや」です。
提供されたホロスコープ画像（もしあれば）とカード結果をもとに、お客様（名前や相談内容はLINE本文から読み取ってください）への有料鑑定書を作成してください。
以下の指定フォーマットのJSONのみを出力してください。それ以外の文字は一切不要です。
必ず上品で優しく包み込むような標準語で、お客様が「なんでわかるの！？」と驚き、心が軽くなる文章にしてください。箇条書きは禁止です。

【お客様からのLINEメッセージ（ここから名前や状況を読み取って共感してください）】
${userInfo}

【引いたカード結果】
${cards}

【出力JSONフォーマット】
{
  "p2": "○○というお気持ち、受け取りました...（から始まる、ホロスコープからの本質前編。約300文字）",
  "p3": "あなたは実はこういう方です...（などを用いた、本質後編・才能・使命。なぜ今うまくいかないかの核心。約700文字）",
  "p4": "（タロット1枚目の正逆位置を明記し、現在の状況と共感ワード。約300文字）",
  "p5": "（タロット2枚目などからの、障害と今すぐできるアドバイス。責めない。約700文字）",
  "p6": "（タロット3枚目からの未来への希望と具体的なアドバイス。大丈夫という安心感。約700文字）",
  "p7": "（鑑定全体を通じての結城あやからの応援メッセージ。あなたなら大丈夫。ゆっくり受け取って。約400文字）"
}
    `;

    const modelRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
    const modelData = await modelRes.json();
    if(modelData.error) throw new Error("モデル一覧の取得に失敗しました: " + modelData.error.message);
    
    let targetModel = "models/gemini-1.5-flash"; // default fallback
    const available = modelData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).map(m => m.name);
    const preferred = ["models/gemini-1.5-flash", "models/gemini-2.0-flash", "models/gemini-3.5-flash", "models/gemini-1.5-pro", "models/gemini-pro-vision"];
    let validModels = preferred.filter(p => available.includes(p));
    if(validModels.length === 0) validModels = ["models/gemini-1.5-flash"];
    
    let data = null;
    let lastError = "";

    for(let i=0; i<validModels.length; i++) {
      let model = validModels[i];
      document.getElementById('ai-loading').textContent = `AIが魂を込めて鑑定中... (現在GoogleのAIが混雑中のため、別の頭脳[${model}]に切り替えて再挑戦しています...)`;
      
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${apiKey}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, ...imageParts] }] })
      });
      
      data = await response.json();
      
      if(data.error) {
        lastError = data.error.message;
        const errStr = lastError.toLowerCase();
        
        // If it's a hard quota limit (like clicking too many times per minute)
        if(errStr.includes("quota") || errStr.includes("429")) {
           throw new Error(`Google AIの「1分間の連続使用制限（スパム防止）」に引っかかってしまいました💦 1分間だけ待ってから、もう一度ボタンを押してください！\n（詳細: ${lastError}）`);
        }
        
        if(errStr.includes("high demand") || errStr.includes("503")) {
          // Wait 2 seconds before trying the next model
          await new Promise(r => setTimeout(r, 2000));
          continue;
        } else {
          throw new Error(lastError); // Invalid key or prompt error
        }
      } else {
        break; // Success!
      }
    }

    if(data && data.error) throw new Error("現在GoogleのAIが世界的に大混雑しているようです💦 少し待ってからもう一度お試しください！詳細: " + lastError);

    
    let aiText = data.candidates[0].content.parts[0].text;
    aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
    const result = JSON.parse(aiText);
    
    ['p2','p3','p4','p5','p6','p7'].forEach(id => {
      if(result[id]) {
        document.getElementById('input-' + id).value = result[id];
        updateText(id);
      }
    });
    
    alert("✨ AI鑑定が完了し、2〜7P目に自動入力されました！");
  } catch (err) {
    alert("エラーが発生しました: " + err.message);
  } finally {
    document.getElementById('ai-loading').style.display = 'none';
  }
}

// PDF Generation
function generatePDF() {
  document.getElementById('loading').style.display = 'block';
  const element = document.getElementById('pdf-content');
  const opt = {
    margin:       0,
    filename:     `結城あや_鑑定書_${Date.now()}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save().then(() => {
    document.getElementById('loading').style.display = 'none';
  });
}
