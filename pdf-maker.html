<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鑑定書PDFメーカー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hiragino Kaku Gothic Pro', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
    .sidebar { width: 450px; background: white; padding: 20px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
    .preview-container { flex: 1; overflow-y: auto; padding: 40px; background: #e0e5ec; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    
    h1 { font-size: 20px; color: #333; margin-top: 0; }
    .section-title { font-size: 15px; color: #7b2ff7; margin: 15px 0 10px; border-bottom: 2px solid #7b2ff7; padding-bottom: 5px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; color: #555; }
    textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical; font-size: 13px; }
    input[type="file"], input[type="text"], input[type="password"] { width: 100%; font-size: 13px; padding: 6px; box-sizing: border-box; }
    
    .controls, .img-controls { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
    .controls button, .img-controls button { padding: 2px 6px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    .controls span { font-size: 11px; color: #666; }
    
    .btn-main { background: linear-gradient(135deg, #7b2ff7, #f72f7b); color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-magic { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
    
    /* PDF Pages */
    #pdf-content { background: transparent; }
    .page { width: 794px; height: 1123px; background-color: #fff; background-size: cover; background-position: center; position: relative; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .pdf-text { position: absolute; z-index: 10; font-family: 'Noto Serif JP', serif; color: #333; white-space: pre-wrap; line-height: 1.6; font-size: 16px; top: 120px; left: 100px; right: 100px; bottom: 120px; }
    .pdf-image { position: absolute; z-index: 5; object-fit: contain; }
    
    /* Defaults */
    #img-horoscope { top: 150px; left: 100px; width: 594px; height: 350px; }
    #text-p2 { top: 550px; }
    #img-cards { top: 150px; left: 50px; width: 694px; height: 400px; }
    #text-p4 { top: 600px; }
  </style>
</head>
<body>

<div class="sidebar">
  <h1>✨ 鑑定書PDFメーカー</h1>
  
  <div class="section-title">🔮 ①AI全自動入力（魔法のボタン）</div>
  <div class="form-group" style="background:#f9f9f9; padding:10px; border-radius:8px; border:1px solid #ddd;">
    <label>🔑 Gemini APIキー（設定するとAI機能が使えます）</label>
    <input type="password" id="api-key" placeholder="AIの鍵を入力..." onchange="saveApiKey()">
    
    <label style="margin-top:10px;">👤 お客様情報（名前・相談内容など）</label>
    <textarea id="ai-userinfo" placeholder="例：お名前：なな様、相談内容：不妊治療について..." style="height:50px;"></textarea>
    
    <label style="margin-top:10px;">🎴 カード展開結果</label>
    <textarea id="ai-cards" placeholder="カードアプリのテキストをコピペ..." style="height:50px;"></textarea>
    
    <label style="margin-top:10px;">🌟 ホロスコープのスクショ（複数選択可）</label>
    <input type="file" id="ai-horoscope-images" accept="image/*" multiple>
    <div style="font-size:11px; color:#888; margin-top:4px;">※ホロスコープの画像（円盤と表など）をまとめて選択すると、AIが星を解読します。</div>
    
    <button class="btn-magic" style="margin-top:15px;" onclick="generateWithAI()">✨ AIに占わせて全自動入力する！</button>
    <div id="ai-loading" style="display:none; text-align:center; color:#0072ff; font-weight:bold; font-size:13px;">AIが魂を込めて鑑定中...（約30秒〜1分かかります）</div>
  </div>

  <div class="section-title">🖼 ②画像アップロード＆調整</div>
  <div class="form-group">
    <label>🌟 2P目：ホロスコープ画像（PDFに貼る用）</label>
    <input type="file" accept="image/*" onchange="previewImage(event, 'img-horoscope')">
    <div class="img-controls">
      <span>サイズ:</span><button onclick="adjImg('horoscope','w',10)">＋</button><button onclick="adjImg('horoscope','w',-10)">ー</button>
      <span>上下:</span><button onclick="adjImg('horoscope','t',-10)">上</button><button onclick="adjImg('horoscope','t',10)">下</button>
      <span>左右:</span><button onclick="adjImg('horoscope','l',-10)">左</button><button onclick="adjImg('horoscope','l',10)">右</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>🔮 4P目：カード展開画像（PDFに貼る用）</label>
    <input type="file" accept="image/*" onchange="previewImage(event, 'img-cards')">
    <div class="img-controls">
      <span>サイズ:</span><button onclick="adjImg('cards','w',10)">＋</button><button onclick="adjImg('cards','w',-10)">ー</button>
      <span>上下:</span><button onclick="adjImg('cards','t',-10)">上</button><button onclick="adjImg('cards','t',10)">下</button>
      <span>左右:</span><button onclick="adjImg('cards','l',-10)">左</button><button onclick="adjImg('cards','l',10)">右</button>
    </div>
  </div>

  <div class="section-title">📝 ③テキスト微調整</div>
  <!-- Text Inputs -->
  <div class="form-group">
    <label>2P目：ご挨拶と本質（前編）</label>
    <textarea id="input-p2" oninput="updateText('p2')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p2','fs',1)">＋</button><button onclick="adjust('p2','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p2','lh',0.1)">＋</button><button onclick="adjust('p2','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p2','pad',10)">広</button><button onclick="adjust('p2','pad',-10)">狭</button>
      <span>上下:</span><button onclick="adjust('p2','top',10)">下</button><button onclick="adjust('p2','top',-10)">上</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>3P目：本質（後編）と才能</label>
    <textarea id="input-p3" oninput="updateText('p3')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p3','fs',1)">＋</button><button onclick="adjust('p3','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p3','lh',0.1)">＋</button><button onclick="adjust('p3','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p3','pad',10)">広</button><button onclick="adjust('p3','pad',-10)">狭</button>
    </div>
  </div>

  <div class="form-group">
    <label>4P目：現在の状況</label>
    <textarea id="input-p4" oninput="updateText('p4')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p4','fs',1)">＋</button><button onclick="adjust('p4','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p4','lh',0.1)">＋</button><button onclick="adjust('p4','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p4','pad',10)">広</button><button onclick="adjust('p4','pad',-10)">狭</button>
      <span>上下:</span><button onclick="adjust('p4','top',10)">下</button><button onclick="adjust('p4','top',-10)">上</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>5P目：障害とアドバイス</label>
    <textarea id="input-p5" oninput="updateText('p5')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p5','fs',1)">＋</button><button onclick="adjust('p5','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p5','lh',0.1)">＋</button><button onclick="adjust('p5','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p5','pad',10)">広</button><button onclick="adjust('p5','pad',-10)">狭</button>
    </div>
  </div>

  <div class="form-group">
    <label>6P目：未来への希望</label>
    <textarea id="input-p6" oninput="updateText('p6')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p6','fs',1)">＋</button><button onclick="adjust('p6','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p6','lh',0.1)">＋</button><button onclick="adjust('p6','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p6','pad',10)">広</button><button onclick="adjust('p6','pad',-10)">狭</button>
    </div>
  </div>

  <div class="form-group">
    <label>7P目：結城あやからのメッセージ</label>
    <textarea id="input-p7" oninput="updateText('p7')"></textarea>
    <div class="controls">
      <span>サイズ:</span><button onclick="adjust('p7','fs',1)">＋</button><button onclick="adjust('p7','fs',-1)">ー</button>
      <span>行間:</span><button onclick="adjust('p7','lh',0.1)">＋</button><button onclick="adjust('p7','lh',-0.1)">ー</button>
      <span>余白:</span><button onclick="adjust('p7','pad',10)">広</button><button onclick="adjust('p7','pad',-10)">狭</button>
    </div>
  </div>

  <button class="btn-main" onclick="generatePDF()">📥 PDFをダウンロードする</button>
  <div id="loading" style="display:none; text-align:center; margin-top:10px; color:#f72f7b; font-weight:bold;">高画質PDFを生成中...</div>
</div>

<div class="preview-container">
  <div id="pdf-content">
    <div class="page" id="page1" style="background-image: url('images/bg_1.png');"></div>
    <div class="page" id="page2" style="background-image: url('images/bg_2.png');">
      <img id="img-horoscope" class="pdf-image" style="display:none;">
      <div id="text-p2" class="pdf-text"></div>
    </div>
    <div class="page" id="page3" style="background-image: url('images/bg_3.png');">
      <div id="text-p3" class="pdf-text"></div>
    </div>
    <div class="page" id="page4" style="background-image: url('images/bg_4.png');">
      <img id="img-cards" class="pdf-image" style="display:none;">
      <div id="text-p4" class="pdf-text"></div>
    </div>
    <div class="page" id="page5" style="background-image: url('images/bg_5.png');">
      <div id="text-p5" class="pdf-text"></div>
    </div>
    <div class="page" id="page6" style="background-image: url('images/bg_6.png');">
      <div id="text-p6" class="pdf-text"></div>
    </div>
    <div class="page" id="page7" style="background-image: url('images/bg_7.png');">
      <div id="text-p7" class="pdf-text"></div>
    </div>
    <div class="page" id="page8" style="background-image: url('images/bg_8.png');"></div>
  </div>
</div>

<script>
// Initialization and State
const styles = {};
['p2','p3','p4','p5','p6','p7'].forEach(id => {
  styles[id] = { fs: 16, lh: 1.6, pad: 100, top: (id==='p2'?550:(id==='p4'?600:120)) };
});
const imgStyles = {
  horoscope: { w: 594, t: 150, l: 100 },
  cards: { w: 694, t: 150, l: 50 }
};

window.onload = () => {
  const savedKey = localStorage.getItem('geminiApiKey');
  if(savedKey) document.getElementById('api-key').value = savedKey;
};

function saveApiKey() {
  localStorage.setItem('geminiApiKey', document.getElementById('api-key').value);
}

function updateText(id) {
  document.getElementById('text-' + id).textContent = document.getElementById('input-' + id).value;
}

function previewImage(event, imgId) {
  const file = event.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById(imgId);
      img.src = e.target.result;
      img.style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

// Adjustments
function adjust(id, prop, amount) {
  styles[id][prop] += amount;
  const el = document.getElementById('text-' + id);
  if(prop === 'fs') el.style.fontSize = styles[id].fs + 'px';
  else if(prop === 'lh') el.style.lineHeight = styles[id].lh;
  else if(prop === 'pad') { el.style.left = styles[id].pad + 'px'; el.style.right = styles[id].pad + 'px'; }
  else if(prop === 'top') el.style.top = styles[id].top + 'px';
}

function adjImg(id, prop, amount) {
  imgStyles[id][prop] += amount;
  const el = document.getElementById('img-' + id);
  if(prop === 'w') el.style.width = imgStyles[id].w + 'px';
  else if(prop === 't') el.style.top = imgStyles[id].t + 'px';
  else if(prop === 'l') el.style.left = imgStyles[id].l + 'px';
}

// AI Generation (Gemini)
async function fileToGenerativePart(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      resolve({
        inlineData: { data: reader.result.split(",")[1], mimeType: file.type }
      });
    };
    reader.readAsDataURL(file);
  });
}

async function generateWithAI() {
  const apiKey = document.getElementById('api-key').value;
  if(!apiKey) { alert("Gemini APIキーを入力してください！"); return; }
  
  const userInfo = document.getElementById('ai-userinfo').value;
  const cards = document.getElementById('ai-cards').value;
  const files = document.getElementById('ai-horoscope-images').files;
  
  if(!userInfo || !cards || files.length === 0) {
    alert("お客様情報、カード結果、ホロスコープ画像（星読み用）の3つをすべてセットしてください！"); return;
  }
  
  document.getElementById('ai-loading').style.display = 'block';
  
  try {
    const imageParts = await Promise.all([...files].map(fileToGenerativePart));
    
    const prompt = `
あなたは「プロの星読み＆カード鑑定士・結城あや」です。
提供されたホロスコープ画像（複数枚）の天体配置・アスペクトと、カード結果をもとに、悩めるお客様への有料鑑定書を作成してください。
以下の指定フォーマットのJSONのみを出力してください。それ以外の文字は一切不要です。
必ず上品で優しく包み込むような標準語で、お客様が「なんでわかるの！？」と驚き、心が軽くなる文章にしてください。箇条書きは禁止です。

【お客様情報・相談内容】
${userInfo}

【カード結果】
${cards}

【出力JSONフォーマット】
{
  "p2": "○○というお気持ち、受け取りました...（から始まる、ホロスコープからの本質前編。約300文字）",
  "p3": "あなたは実はこういう方です...（などを用いた、本質後編・才能・使命。なぜ今うまくいかないかの核心。約700文字）",
  "p4": "（タロット1枚目の正逆位置を明記し、現在の状況と共感ワード。約300文字）",
  "p5": "（タロット2枚目とルノマンからの、障害と今すぐできるアドバイス。責めない。約700文字）",
  "p6": "（タロット3枚目からの未来への希望と具体的なアドバイス。大丈夫という安心感。約700文字）",
  "p7": "（鑑定全体を通じての結城あやからの応援メッセージ。あなたなら大丈夫。ゆっくり受け取って。約400文字）"
}
    `;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, ...imageParts] }]
      })
    });

    const data = await response.json();
    if(data.error) throw new Error(data.error.message);
    
    let aiText = data.candidates[0].content.parts[0].text;
    // Extract JSON if wrapped in markdown
    aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
    const result = JSON.parse(aiText);
    
    ['p2','p3','p4','p5','p6','p7'].forEach(id => {
      if(result[id]) {
        document.getElementById('input-' + id).value = result[id];
        updateText(id);
      }
    });
    
    alert("AI鑑定が完了し、自動入力されました！✨");
  } catch (err) {
    alert("エラーが発生しました: " + err.message);
  } finally {
    document.getElementById('ai-loading').style.display = 'none';
  }
}

// PDF Generation
function generatePDF() {
  document.getElementById('loading').style.display = 'block';
  const element = document.getElementById('pdf-content');
  const opt = {
    margin:       0,
    filename:     `結城あや_鑑定書_${Date.now()}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'px', format: [794, 1123], orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save().then(() => {
    document.getElementById('loading').style.display = 'none';
  });
}
</script>
</body>
</html>
